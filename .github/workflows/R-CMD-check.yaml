# Adapted from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release'}
          # rstan's compile fails intermittently on GitHub's Windows runners, so
          # skip --as-cran there: it runs the \donttest examples, which fit models.
          # The rstan fitting tests are skipped on Windows CI in tests/testthat/helper.R.
          - {os: windows-latest, r: 'release', args: 'c("--no-manual")'}
          - {os: ubuntu-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # cmdstanr isn't on CRAN, and pak ignores Additional_repositories
          extra-packages: any::rcmdcheck, github::stan-dev/cmdstanr
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: ${{ matrix.config.args || 'c("--no-manual", "--as-cran")' }}
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
      - name: Show the failing output
        if: failure()
        shell: bash
        run: |
          # post failing example/test output as (public) annotations: the first
          # failure in full, then the end of the file
          enc() { sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}'; }
          for f in $(find check -name '*.Rout.fail' 2>/dev/null); do
            first=$(awk '/^(══ Failed|── (Error|Failure))/{p=1} p' "$f" | head -n 70 | enc)
            [ -n "$first" ] && echo "::error title=$(basename "$f") (first failure)::$first"
            echo "::error title=$(basename "$f") (end)::$(tail -n 40 "$f" | enc)"
          done
